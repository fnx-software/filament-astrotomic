name: Filament Astrotomic release checks

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'chore/**'
  pull_request:

permissions:
  contents: read

jobs:
  package-quality:
    name: PHP ${{ matrix.php }} / package tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite, intl, fileinfo
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: PHP syntax (source and tests)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find src tests -name '*.php' -print0)
      - name: Check Pint style
        run: composer test:lint
      - name: Run complete Pest suite
        run: composer test
